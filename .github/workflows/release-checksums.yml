name: Release combined checksums
run-name: Combined SHA256 checksums for ${{ inputs.tag || github.event.release.tag_name }}

# Downloads every asset of a GitHub Release and uploads
# AMMOcoin-v<version>-ALL-PLATFORMS-CHECKSUMS.txt (sha256sum format) to the same release.
# Runs when a release is published, and on demand after assets are added or replaced
# (Actions > Release combined checksums > Run workflow). The file must then be signed
# offline (docs/release/SIGNING.md); a stale .sig is deleted when the file changes.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v1.1.1)
        required: true
        default: v1.1.1

permissions:
  contents: write

jobs:
  checksums:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Download release assets
        run: |
          set -euo pipefail
          mkdir assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets
          ls -l assets

      - name: Write combined checksums
        run: |
          set -euo pipefail
          VER=${TAG#v}
          OUT="AMMOcoin-v${VER}-ALL-PLATFORMS-CHECKSUMS.txt"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          cd assets
          # per-platform checksum files and signatures are not release binaries
          files=$(ls -1 | { grep -vE -- '-CHECKSUMS?\.txt(\.sig)?$|\.sig$|\.asc$' || true; } | sort)
          [ -n "$files" ] || { echo "no assets on release $TAG"; exit 1; }
          echo "$files" | tr '\n' '\0' | xargs -0 sha256sum > "../$OUT"
          cd ..
          cat "$OUT"
          # cross-check against the per-platform CHECKSUM files where they exist
          for c in assets/*-CHECKSUM.txt; do
            [ -f "$c" ] || continue
            while read -r sum name; do
              name=${name#\*}
              if [ -f "assets/$name" ] && ! grep -q "^$sum  $name\$" "$OUT"; then
                echo "::error::$name does not match $(basename "$c") - assets were replaced without regenerating it"
                exit 1
              fi
            done < "$c"
          done

      - name: Upload to release
        run: |
          set -euo pipefail
          if [ -f "assets/$OUT" ] && cmp -s "assets/$OUT" "$OUT"; then
            echo "$OUT on the release is already up to date"
            exit 0
          fi
          gh release upload "$TAG" "$OUT" --repo "$GITHUB_REPOSITORY" --clobber
          if [ -f "assets/$OUT.sig" ]; then
            gh release delete-asset "$TAG" "$OUT.sig" --repo "$GITHUB_REPOSITORY" --yes
            echo "::warning::$OUT changed; deleted the stale $OUT.sig. Re-sign it (docs/release/SIGNING.md)."
          fi
          echo "::notice::Uploaded $OUT. Sign it offline with scripts/release/sign-release.sh and upload the .sig."
