name: Build AMMOcoin v1.1.1 Windows Only
run-name: Build AMMOcoin v1.1.1 Windows x86_64 (${{ github.ref_name }})

on:
  workflow_dispatch:
    # Manual trigger only - prevents multiple simultaneous builds

jobs:
  build-windows-x86_64:
    runs-on: ubuntu-22.04
    name: Build Windows x86_64 Binaries

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Windows cross-compilation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            autoconf \
            autoconf-archive \
            automake \
            libtool \
            pkg-config \
            git \
            curl \
            wget \
            python3 \
            mingw-w64 \
            g++-mingw-w64-x86-64 \
            gcc-mingw-w64-x86-64 \
            libgmp-dev \
            libsodium-dev \
            nsis

      - name: Configure MinGW to use POSIX threads
        run: |
          echo "🔧 Configuring MinGW-w64 to use POSIX threading model..."
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          echo "✅ MinGW configured for POSIX threads (enables std::mutex, std::thread)"

      - name: Install Rust with Windows target
        run: |
          echo "🦀 Installing Rust 1.80+ and setting as default..."
          rustup toolchain install 1.80
          rustup default 1.80
          rustup target add x86_64-pc-windows-gnu
          rustc --version
          cargo --version
          echo "✅ Rust 1.80 set as default with Windows target"

      - name: Verify Genesis Block Hash
        run: |
          echo "🔍 Verifying v1.1 genesis block in source code..."
          GENESIS_HASH="000000593410213331b5adcc6a79054a984bfc9999825e579171f81f2eccddd2"
          MERKLE_ROOT="a4b9dffe1a0e162f632ee851de1414adb433ab2303619c54fb859caa315042ab"
          NONCE="1299391"
          if grep -q "$GENESIS_HASH" source/src/chainparams.cpp; then
            echo "✅ Correct genesis hash found: $GENESIS_HASH"
          else
            echo "❌ ERROR: Expected genesis hash not found!"
            exit 1
          fi

      - name: Ensure Sapling params (bundled by the NSIS installer)
        run: scripts/packaging/ammocoin-fetch-params --dir source/params

      - name: Update timestamps on pre-generated files
        run: |
          echo "🔧 Updating timestamps on pre-generated autotools files..."
          find source -name "configure" -exec touch {} \;
          find source -name "Makefile.in" -exec touch {} \;
          find source -name "aclocal.m4" -exec touch {} \;
          echo "✅ Timestamps updated"

      - name: Build Windows dependencies with Qt patch
        working-directory: source/depends
        run: |
          echo "🔨 Building dependencies for Windows (this takes 15-20 minutes)..."
          echo "Building: Boost, OpenSSL, BerkeleyDB, libevent, ZMQ, GMP, libsodium, Qt..."

          # Start the build
          make -j$(nproc) HOST=x86_64-w64-mingw32 &
          BUILD_PID=$!

          # Monitor for Qt extraction and apply patch
          echo "📡 Monitoring for Qt extraction to apply numeric_limits patch..."
          while kill -0 $BUILD_PID 2>/dev/null; do
            QT_HEADER="work/build/x86_64-w64-mingw32/qt/*/qtbase/src/corelib/tools/qbytearraymatcher.h"
            if ls $QT_HEADER 2>/dev/null; then
              echo "✅ Qt extracted, applying #include <limits> patch..."
              for file in $QT_HEADER; do
                if ! grep -q "#include <limits>" "$file"; then
                  sed -i '/#include <QtCore\/qbytearray.h>/a \\n#include <limits>' "$file"
                  echo "✅ Patched: $file"
                fi
              done
              break
            fi
            sleep 5
          done

          # Wait for build to complete
          wait $BUILD_PID
          BUILD_RESULT=$?

          if [ $BUILD_RESULT -ne 0 ]; then
            echo "❌ Build failed with exit code $BUILD_RESULT"
            exit $BUILD_RESULT
          fi

          echo "✅ Dependencies built successfully"

      - name: Replace depends Rust binaries with Rust 1.80
        run: |
          echo "🔧 Replacing old Rust binaries in depends with Rust 1.80..."
          DEPENDS_NATIVE_BIN="source/depends/x86_64-w64-mingw32/native/bin"

          if [ -d "$DEPENDS_NATIVE_BIN" ]; then
            echo "📂 Found depends native bin directory"

            # Remove old Rust binaries
            rm -f "$DEPENDS_NATIVE_BIN/cargo" "$DEPENDS_NATIVE_BIN/rustc" 2>/dev/null || true

            # Create symlinks to our Rust 1.80
            ln -sf "$(rustup which cargo --toolchain 1.80)" "$DEPENDS_NATIVE_BIN/cargo"
            ln -sf "$(rustup which rustc --toolchain 1.80)" "$DEPENDS_NATIVE_BIN/rustc"

            echo "✅ Replaced with symlinks to Rust 1.80"
            ls -lh "$DEPENDS_NATIVE_BIN/cargo" "$DEPENDS_NATIVE_BIN/rustc"

            # Verify Windows target standard library
            RUST_SYSROOT="$("$DEPENDS_NATIVE_BIN/rustc" --print sysroot)"
            echo "📂 Rust sysroot: $RUST_SYSROOT"
            if [ -d "$RUST_SYSROOT/lib/rustlib/x86_64-pc-windows-gnu" ]; then
              echo "✅ Windows target standard library found"
            else
              echo "❌ ERROR: Windows target standard library not found!"
              exit 1
            fi
          else
            echo "❌ ERROR: Depends native bin directory not found!"
            exit 1
          fi

      - name: Build AMMOcoin Windows Binaries
        working-directory: source
        run: |
          echo "🔨 Starting Windows cross-compilation..."

          echo "🧹 Cleaning stale Qt generated files (moc/ui/qrc)..."
          rm -f src/qt/moc_*.cpp src/qt/ammocoin/moc_*.cpp src/qt/ammocoin/settings/moc_*.cpp
          rm -f src/qt/forms/ui_*.h src/qt/ammocoin/forms/ui_*.h src/qt/ammocoin/settings/forms/ui_*.h
          rm -f src/qt/qrc_*.cpp src/qt/*.moc src/qt/locale/*.qm
          echo "✅ Stale Qt files cleaned"

          chmod +x configure
          chmod +x src/univalue/configure
          chmod +x src/secp256k1/configure
          chmod +x src/chiabls/configure

          echo "🔧 Configuring for Windows x86_64..."
          # Use explicit paths from rustup to avoid version switching
          # Add ntdll to LDFLAGS for Rust Windows target support
          CARGO="$(rustup which cargo --toolchain 1.80)" \
          RUSTC="$(rustup which rustc --toolchain 1.80)" \
          LDFLAGS="-lntdll" \
          CONFIG_SITE=$PWD/depends/x86_64-w64-mingw32/share/config.site \
          ./configure \
            --prefix=/ \
            --host=x86_64-w64-mingw32 \
            --disable-tests \
            --disable-bench \
            --with-gui=qt5 \
            --enable-wallet \
            --with-incompatible-bdb \
            --disable-maintainer-mode

          echo "🔧 Patching src/Makefile to add --target flag to cargo and ntdll library..."

          # Patch the Makefile to add --target flag
          if grep -q '$(CARGO) build.*--manifest-path' src/Makefile; then
            sed -i 's|\$(CARGO) build \(.*\)--manifest-path|\$(CARGO) build \1--target x86_64-pc-windows-gnu --manifest-path|g' src/Makefile
            echo "✅ Patched cargo build command with Windows target"
          fi

          # Add ntdll to LDADD for all binaries - CORRECTED to append to += lines
          if grep -q '^ammocoind_LDADD +=' src/Makefile; then
            sed -i 's|^\(ammocoind_LDADD += .*\)$|\1 -lntdll|' src/Makefile
            sed -i 's|^\(ammocoin_cli_LDADD += .*\)$|\1 -lntdll|' src/Makefile
            sed -i 's|^\(ammocoin_tx_LDADD += .*\)$|\1 -lntdll|' src/Makefile
            sed -i 's|^\(qt_ammocoin_qt_LDADD += .*\)$|\1 -lntdll|' src/Makefile
            echo "✅ Added ntdll library to linker flags"
            echo "Verifying ntdll patch:"
            grep "LDADD += .*ntdll" src/Makefile | head -3
          fi

          echo "🔧 Touching Makefiles to prevent regeneration..."
          find . -name "Makefile" -exec touch {} \;
          find . -name "Makefile.in" -exec touch {} \;
          sleep 1
          touch src/univalue/Makefile src/secp256k1/Makefile src/Makefile

          # configure rewrites tracked files (setup.nsi, Info.plist, test/config.ini, ...);
          # without this share/genbuild.sh stamps the version "-dirty"
          "$GITHUB_WORKSPACE/scripts/ci/mark-tracked-build-outputs.sh"

          echo "✅ Starting build with Rust 1.80 and Windows target..."
          CARGO="$(rustup which cargo --toolchain 1.80)" \
          RUSTC="$(rustup which rustc --toolchain 1.80)" \
          CARGO_BUILD_TARGET=x86_64-pc-windows-gnu \
          make -j$(nproc) || {
            # If build fails, check if it's the librustzcash path issue
            if [ -f target/x86_64-pc-windows-gnu/release/librustzcash.a ]; then
              echo "🔧 Found librustzcash.a in target subdirectory, creating symlink..."
              mkdir -p target/release
              ln -sf ../x86_64-pc-windows-gnu/release/librustzcash.a target/release/librustzcash.a
              echo "✅ Symlink created, retrying build..."
              CARGO="$(rustup which cargo --toolchain 1.80)" \
              RUSTC="$(rustup which rustc --toolchain 1.80)" \
              CARGO_BUILD_TARGET=x86_64-pc-windows-gnu \
              make -j$(nproc)
            else
              echo "❌ Build failed and librustzcash.a not found"
              exit 1
            fi
          }
          # make can rewrite more tracked files after genbuild.sh ran: re-mark and re-stamp
          if grep -q -- '-dirty' src/obj/build.h; then
            "$GITHUB_WORKSPACE/scripts/ci/mark-tracked-build-outputs.sh"
            CARGO="$(rustup which cargo --toolchain 1.80)" \
            RUSTC="$(rustup which rustc --toolchain 1.80)" \
            CARGO_BUILD_TARGET=x86_64-pc-windows-gnu \
            make -j$(nproc)
          fi
          "$GITHUB_WORKSPACE/scripts/ci/check-build-version.sh" src/obj/build.h
          echo "✅ Build completed successfully"

      - name: Verify Compiled Binaries
        working-directory: source
        run: |
          echo "🔍 Verifying compiled binaries..."
          [ -f src/ammocoind.exe ] && echo "✅ ammocoind.exe found" || (echo "❌ ammocoind.exe missing" && exit 1)
          [ -f src/ammocoin-cli.exe ] && echo "✅ ammocoin-cli.exe found" || (echo "❌ ammocoin-cli.exe missing" && exit 1)
          [ -f src/ammocoin-tx.exe ] && echo "✅ ammocoin-tx.exe found" || (echo "❌ ammocoin-tx.exe missing" && exit 1)
          # The installer, Start-menu shortcuts and zip all advertise the GUI wallet: it must exist.
          [ -f src/qt/ammocoin-qt.exe ] && echo "✅ ammocoin-qt.exe found" || { echo "❌ ammocoin-qt.exe missing"; exit 1; }
          "$GITHUB_WORKSPACE/scripts/ci/check-build-version.sh" src/obj/build.h src/ammocoind.exe src/ammocoin-cli.exe src/qt/ammocoin-qt.exe
          # the Qt platform plugin must be linked in, or the GUI exits with "no Qt platform plugin"
          strings src/qt/ammocoin-qt.exe | grep -q 'QWindowsIntegrationPlugin' \
            || { echo "❌ ammocoin-qt.exe lacks the static qwindows platform plugin"; exit 1; }

          GENESIS_HASH="000000593410213331b5adcc6a79054a984bfc9999825e579171f81f2eccddd2"
          if strings src/ammocoind.exe | grep -q "$GENESIS_HASH"; then
            echo "✅ Genesis hash verified in binary"
          else
            echo "❌ Genesis hash NOT found!"
            exit 1
          fi

          echo "📋 Binary info:"
          file src/ammocoind.exe src/ammocoin-cli.exe src/ammocoin-tx.exe src/qt/ammocoin-qt.exe 2>/dev/null || true
          echo "📊 Binary sizes:"
          ls -lh src/ammocoind.exe src/ammocoin-cli.exe src/ammocoin-tx.exe src/qt/ammocoin-qt.exe 2>/dev/null || true

      - name: Strip binaries
        working-directory: source
        run: |
          x86_64-w64-mingw32-strip src/ammocoind.exe src/ammocoin-cli.exe src/ammocoin-tx.exe src/qt/ammocoin-qt.exe
          ls -lh src/ammocoind.exe src/ammocoin-cli.exe src/ammocoin-tx.exe src/qt/ammocoin-qt.exe

      - name: Create Release Package
        run: |
          echo "📦 Creating Windows release package..."
          rm -rf release-package && mkdir -p release-package/bin
          cp source/src/ammocoind.exe source/src/ammocoin-cli.exe source/src/ammocoin-tx.exe \
             source/src/qt/ammocoin-qt.exe release-package/bin/
          cp scripts/packaging/windows/install-params.ps1 release-package/
          # Windows tools expect CRLF in .bat/.txt
          sed 's/$/\r/' scripts/packaging/windows/install-params.bat > release-package/install-params.bat
          sed 's/$/\r/' scripts/packaging/windows/README.txt > release-package/README.txt
          cd release-package
          tar -czf ../AMMOcoin-v1.1.1-Windows-x86_64.tar.gz bin install-params.bat install-params.ps1 README.txt
          zip -r ../AMMOcoin-v1.1.1-Windows-x86_64.zip bin install-params.bat install-params.ps1 README.txt
          cd ..
          unzip -l AMMOcoin-v1.1.1-Windows-x86_64.zip
          echo "✅ Release packages created"

      - name: Build NSIS Installer
        run: |
          echo "📦 Building Windows NSIS installer..."
          # share/setup.nsi is generated by configure from share/setup.nsi.in with this
          # checkout's paths; it bundles the GUI, daemon, CLI and the Sapling params
          # (installed to %APPDATA%\AMMOcoinParams).
          grep -q 'AMMOcoinParams' source/share/setup.nsi
          mkdir -p source/release
          cp source/src/qt/ammocoin-qt.exe source/src/ammocoind.exe source/src/ammocoin-cli.exe source/release/
          rm -f source/ammocoin-*-setup*.exe
          makensis -V2 -WX source/share/setup.nsi
          INSTALLER=$(find source -maxdepth 1 -name "ammocoin-*-setup*.exe" | head -1)
          [ -n "$INSTALLER" ] || { echo "❌ NSIS installer output not found"; exit 1; }
          cp "$INSTALLER" AMMOcoin-v1.1.1-Windows-x86_64-Setup.exe
          ls -lh AMMOcoin-v1.1.1-Windows-x86_64-Setup.exe
          # sanity: installer must be larger than the GUI + params it embeds (compressed)
          [ "$(stat -c %s AMMOcoin-v1.1.1-Windows-x86_64-Setup.exe)" -gt 40000000 ] \
            || { echo "❌ installer is suspiciously small"; exit 1; }
          echo "✅ NSIS installer created"

      - name: Generate checksums
        run: |
          sha256sum AMMOcoin-v1.1.1-Windows-x86_64.tar.gz AMMOcoin-v1.1.1-Windows-x86_64.zip \
            AMMOcoin-v1.1.1-Windows-x86_64-Setup.exe > AMMOcoin-v1.1.1-Windows-x86_64-CHECKSUM.txt
          cat AMMOcoin-v1.1.1-Windows-x86_64-CHECKSUM.txt

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AMMOcoin-v1.1.1-Windows-x86_64
          if-no-files-found: error
          path: |
            AMMOcoin-v1.1.1-Windows-x86_64.tar.gz
            AMMOcoin-v1.1.1-Windows-x86_64.zip
            AMMOcoin-v1.1.1-Windows-x86_64-Setup.exe
            AMMOcoin-v1.1.1-Windows-x86_64-CHECKSUM.txt

      - name: Upload Individual Binaries
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Binaries
          if-no-files-found: error
          path: |
            source/src/ammocoind.exe
            source/src/ammocoin-cli.exe
            source/src/ammocoin-tx.exe
            source/src/qt/ammocoin-qt.exe
